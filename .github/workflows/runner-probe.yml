name: Runner probe

# Answers ONE question: can this repository get a macOS Intel runner right now?
#
# Why Intel: every macOS ARM64 job since ~17:00 on 20.10.2026 was cancelled after
# 15 minutes without a single step. GitHub's own check-run annotation names the
# reason — "Due to capacity constraints, jobs targeting macOS arm64 runners may
# experience longer queue times" — and the Intel pool is a different one.
#
# Nothing is checked out and nothing is built: the job exists to be ACQUIRED.
# A queued-then-cancelled job proves the pool is unavailable exactly as well as
# a log line would, and this way no minute is wasted on a checkout.
#
# Manual only. No schedule, no push trigger: a probe that runs itself is noise.
#
# EXCEPTION, and it is the only reason this file can run at all: `workflow_dispatch`
# refuses to start a workflow that does not exist on the DEFAULT branch
# ("This event will only trigger a workflow run if the workflow file exists on the
# default branch" — docs, events-that-trigger-workflows). `main` is off limits for
# this probe, so the trigger is `push` scoped to this one branch: GitHub reads the
# workflow file from the pushed ref, so no default-branch copy is needed.
#
# Verified before adding: no other workflow in this repo listens to push except
# `build-ipa.yml`, and it is scoped to `main`, so a push here starts this job and
# nothing else. No checkout, no secrets, no build.

on:
  push:
    branches:
      - ci/runner-probe
  workflow_dispatch:

jobs:
  probe:
    name: Probe macos-26-intel
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - name: Report host
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          xcodebuild -version
