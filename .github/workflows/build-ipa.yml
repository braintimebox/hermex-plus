name: Build Hermes Plus

# Tests gate the RELEASE, not the compile.
#
# Measured on run 37046212026 (v3.9.30, success) — 23 min wall clock:
#   Release guard       26 s
#   Build for testing  248 s
#   Test               689 s   <-- 50% of the whole run
#   Build for device   368 s   <-- a SECOND cold build, on its own runner
#   packaging/release   57 s
#
# Two changes (02.10.2026), each aimed at one of those two facts:
#
#  1. Tests and the device build run in PARALLEL. They used to be serial jobs —
#     `Package IPA: needs: test` — and each paid for its own cold DerivedData on
#     its own runner, so ~17.6 min went on waiting for one after the other.
#     Nothing in the device build depends on the suite, so they now start
#     together and the wall clock becomes max(test, build) instead of the sum.
#
#  2. Tests run 4 simulator clones instead of one. The suite is ~2480 cases
#     through a single worker (`-parallel-testing-worker-count 1`), which is why
#     the Test step alone was 11.5 min. Xcode clones the destination per worker.
#
# The gate keeps its STRENGTH: publication moved to its own `publish` job with
# `needs: [test, build]`, so a red suite still cannot produce a Release. Only the
# order changed — the tests no longer block the compile, they block the publish.
# Publication runs on ubuntu-latest: creating a Release needs no macOS, and the
# IPA travels as an artifact.
#
# Deliberately NOT done: caching DerivedData between runs. The two heavy jobs use
# different runners with no shared cache, the repository is public so minutes are
# not billed, and a stale-cache hit that reports an old result is a worse failure
# than a slow run. Wall-clock is the only thing at stake.
#
# Docs-only pushes (README.md) still skip the whole run.

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

# Serialise runs on main instead of letting them pile up.
#
# Without this, every push to `main` starts its own full macOS job and none of
# them is cancelled — a fast correction to a broken push pays for both runs.
# `cancel-in-progress: false` is deliberate: `main` is the deliverable branch and
# a run that is already packaging an IPA should finish and publish its Release
# rather than be killed half-way, which would leave a version without an
# artifact. Queueing (rather than cancelling) keeps that guarantee.
#
# Consequence worth knowing when reading timings: a push made while a run is
# live waits for it. That wait shows up in the run's `created_at` → `run_started_at`
# gap, NOT in its duration — a "slow" 30 min delivery is often 23 min of build
# plus time spent queued behind the previous run.
concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fast fail: release invariants before spending a macOS runner.
  guard:
    name: Release guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check release invariants
        run: python3 scripts/release-check.py --allow-untagged
      - name: Check local gates
        # Runs all the gates the pre-push hook runs, so a push made with
        # `--no-verify` (which skips the hook entirely) is still caught here.
        # Gates 4 and 5 are advisory and print warnings without failing; gate 6
        # (test-lint) and 7 (doc references) are blocking.
        run: |
          python3 -c "import yaml, sys" 2>/dev/null || pip install -q pyyaml
          python3 scripts/pipeline-precheck.py

  unit-build:
    # ONE BUILD FOR EVERY SHARD.
    #
    # This job used to be inside each shard: three runners compiled the same
    # 688 Swift files independently (measured: 4.4 min on a fast runner, 11 min
    # on a slow one, 2064 compilations for the run), and the slowest of the three
    # set the wall clock. The old note here argued a shared artifact costs as much
    # as a rebuild — that was measured against the full DerivedData (2+ GB), not
    # against what `test-without-building` actually needs: Build/Products and the
    # .xctestrun, a few hundred MB that download in well under a minute.
    #
    # The cache (SPM + CAS) lives here, where the only compilation happens. The
    # shards do not restore it, because they never compile.
    needs: guard
    runs-on: macos-26
    timeout-minutes: 60
    env:
      PROJECT_PATH: HermesMobile.xcodeproj
      SCHEME: HermesMobile
      DERIVED_DATA_PATH: DerivedData
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history: the mtime restore maps each file to the commit that
          # touched it, and a shallow clone has only the tip.
          fetch-depth: 0

      - name: Restore SPM cache
        uses: actions/cache@v4
        with:
          path: ${{ env.DERIVED_DATA_PATH }}/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('HermesMobile.xcodeproj/project.pbxproj') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Restore Xcode compilation cache
        uses: actions/cache@v4
        with:
          path: ${{ env.DERIVED_DATA_PATH }}/CompilationCache.noindex
          key: xcode-cas-${{ runner.os }}-${{ hashFiles('HermesMobile.xcodeproj/project.pbxproj', 'Package.resolved', '**/Package.resolved') }}
          restore-keys: |
            xcode-cas-${{ runner.os }}-

      # DerivedData cache, done correctly.
      #
      # A previous attempt cached this and measured 171s without a cache against
      # 187s with it, and the file concluded that Xcode's incremental state does
      # not survive an archive. That conclusion skipped a step: GitHub checks the
      # commit out at the current time, so every source file looks NEWER than the
      # restored object files, and Xcode rebuilds all 688 of them anyway — the
      # restore was pure cost.
      #
      # Restoring mtime from git (the step below) puts the sources back at their
      # commit times, which makes the cached outputs newer than the sources and
      # lets Xcode skip unchanged files. This is the standard fix for caching
      # DerivedData on GitHub Actions.
      - name: Restore DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.DERIVED_DATA_PATH }}/Build/Intermediates.noindex
            ${{ env.DERIVED_DATA_PATH }}/Build/Products
          key: dd-${{ runner.os }}-${{ hashFiles('HermesMobile/**/*.swift', 'HermesMobile/**/*.m', 'HermesMobile.xcodeproj/project.pbxproj') }}
          restore-keys: |
            dd-${{ runner.os }}-

      - name: Restore source mtimes
        # Puts every source file back at its commit time so the restored object
        # files are NEWER than the sources. Without this Xcode sees freshly
        # checked-out sources and rebuilds everything, which is why the earlier
        # DerivedData cache measured as a slowdown rather than a win.
        # Pinned to v2 by SHA per this repo's action-pinning policy.
        uses: chetan/git-restore-mtime-action@6365eabac94ee2b7a747f96998927a6a6e1994c4  # v2

      - name: Select simulator
        id: sim
        run: |
          set -euo pipefail
          name=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          phones = [
              device["name"]
              for runtime, devices in data["devices"].items()
              if "iOS" in runtime
              for device in devices
              if device.get("isAvailable") and device["name"].startswith("iPhone")
          ]
          preferred = "iPhone 17"
          print(preferred if preferred in phones else phones[0] if phones else "")
          ')
          if [[ -z "${name}" ]]; then
            echo "No available iPhone simulator found:" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator: ${name}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        env:
          SIMULATOR_NAME: ${{ steps.sim.outputs.name }}
        run: |
          set -euo pipefail
          start_seconds=${SECONDS}
          xcodebuild build-for-testing \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -destination "platform=iOS Simulator,name=${SIMULATOR_NAME}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            SWIFT_ENABLE_COMPILE_CACHE=YES \
            CLANG_ENABLE_COMPILE_CACHE=YES \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="-"
          echo "Build-for-testing: $((SECONDS - start_seconds))s"

      # Products + the .xctestrun file. The .xctestrun path is reproducible
      # because every job checks out to the same workspace path, so the absolute
      # paths recorded inside it still resolve on the shard runners.
      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: test-build
          path: |
            ${{ env.DERIVED_DATA_PATH }}/Build/Products
          if-no-files-found: error
          retention-days: 3
          compression-level: 1

  test:
    # THREE SHARDS, ONE SUITE. The single-worker suite measured 689s of a ~23 min
    # run, so the test stage is the only lever left that matters. Workers inside
    # one job were tried and lost (4016s for 4 clones, run 37123440609); separate
    # JOBS are the parallelism this runner actually rewards.
    #
    # Each shard builds for testing itself: sharing a DerivedData artifact across
    # runners costs a download in the same ballpark as the 248s build and adds a
    # way to run against a stale bundle. Three cold builds run concurrently, so
    # the wall clock is build + one third of the suite instead of build + all of it.
    #
    # The split comes from scripts/test_shards.py: it discovers every XCTestCase
    # in the sources and packs them by case count, so a new test file lands in a
    # shard without anyone updating a list.
    name: Test (shard ${{ matrix.shard }}/3)
    needs: [guard, unit-build]
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      PROJECT_PATH: HermesMobile.xcodeproj
      SCHEME: HermesMobile
      DERIVED_DATA_PATH: DerivedData
      RESULT_BUNDLE_PATH: TestResults-${{ matrix.shard }}.xcresult
      # MEASURED, AND REVERTED — the parallel-workers idea is rejected by data.
      #
      # Run 37123440609 with `-parallel-testing-worker-count 4`: the Test step
      # took 4016s against 689s single-worker in the baseline (run 37046212026),
      # and four cases failed on one clone with durations of 41s / 77s / 282s /
      # 354s and NO assertion text — a resource-starvation signature, not a test
      # that disagreed with the code. 2519 cases passed, the same suite that is
      # green at 689s on one worker.
      #
      # Four simulator clones booting and competing for one runner's cores cost
      # far more than the clones save, so this stays at 1. The parallelism that
      # does help is between JOBS (test ∥ device build), not inside the suite.
      TEST_WORKERS: 1
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Правильный вид кэша для этого проекта — КЭШ ЗАГРУЗКИ (SPM), а не кэш сборки.
      #
      # Измерено: полный кэш DerivedData восстанавливался за 15s и не ускорял
      # сборку (171s без кэша против 187s с кэшем). Причина найдена позже: GitHub
      # выкладывает исходники с текущим mtime, поэтому они выглядят новее
      # восстановленных объектных файлов и Xcode пересобирает всё. В job
      # `unit-build` кэш DerivedData используется ВМЕСТЕ с восстановлением mtime
      # из git — там это работает. Здесь кэш не нужен: это отдельная Release-сборка.
      #
      # Кэшируем только SourcePackages: это обходит повторное клонирование шести
      # репозиториев зависимостей на каждый запуск.
      #
      # Ключ хэширует project.pbxproj, а НЕ Package.resolved — тот файл в репозитории
      # не закоммичен, hashFiles() по нему возвращал пустую строку и ключ получался
      # постоянным, то есть кэш никогда не инвалидировался.
      # No compilation happens here any more: the build job produced it once.
      # A few hundred MB of Products + .xctestrun replaces 688 Swift files.
      - name: Download test build
        uses: actions/download-artifact@v4
        with:
          name: test-build
          path: ${{ env.DERIVED_DATA_PATH }}/Build/Products

      - name: Select simulator
        id: sim
        run: |
          set -euo pipefail
          name=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          phones = [
              device["name"]
              for runtime, devices in data["devices"].items()
              if "iOS" in runtime
              for device in devices
              if device.get("isAvailable") and device["name"].startswith("iPhone")
          ]
          preferred = "iPhone 17"
          print(preferred if preferred in phones else phones[0] if phones else "")
          ')
          if [[ -z "${name}" ]]; then
            echo "No available iPhone simulator found:" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "Using simulator: ${name}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      # The 203s of silence between xcodebuild start and the first app log is
      # simulator cold-boot + app install (measured on run 40172846270 shard 1:
      # TEST BUILD SUCCEEDED 07:33:47, first app log 07:37:18). Boot the device
      # in the background so the boot overlaps the 293s build instead of being
      # paid after it. `|| true`: an already-booted device answers non-zero.
      - name: Preboot simulator in background
        env:
          SIMULATOR_NAME: ${{ steps.sim.outputs.name }}
        run: |
          nohup xcrun simctl boot "${SIMULATOR_NAME}" >/dev/null 2>&1 &
          echo "simulator boot started in background (overlaps the build)"

      # Fail here, not inside xcodebuild with a confusing message, if the
      # artifact did not carry a runnable test plan.
      - name: Verify test build
        run: |
          set -euo pipefail
          plan=$(find "${DERIVED_DATA_PATH}/Build/Products" -maxdepth 1 -name '*.xctestrun' | head -1)
          if [[ -z "${plan}" ]]; then
            echo "No .xctestrun in the downloaded build:" >&2
            find "${DERIVED_DATA_PATH}/Build/Products" -maxdepth 2 -type d >&2
            exit 1
          fi
          echo "test plan: ${plan}"

      # Ad-hoc signing, not "no signing": an unsigned bundle carries no
      # entitlements and the OS answers Keychain calls with
      # errSecMissingEntitlement (-34018) — measured on run 40114524544, where 23
      # tests crashed on exactly that. Ad-hoc needs no team or certificate and is
      # what a simulator build without a profile is signed with anyway.
      - name: Test
        env:
          SIMULATOR_NAME: ${{ steps.sim.outputs.name }}
        run: |
          set -euo pipefail
          start_seconds=${SECONDS}
          # MEASURED (run 38135481553): шаг Test = 492s, из них
          #   162.7s  — выполнение 2582 кейсов (медиана 0.002s, p90 0.020s)
          #   365s    — ТИХАЯ настройка симулятора между TEST BUILD SUCCEEDED и
          #             "Testing started": лог в этом окне пуст, внутри xcodebuild
          #             идёт загрузка назначения, установка приложения и раннера.
          #
          # Тесты при этом шли на 'Clone 1 of iPhone 17' — то есть Xcode клонировал
          # симулятор. При TEST_WORKERS=1 параллелизма нет, но цена клона
          # оплачивается целиком. Отключаем параллелизм, чтобы идти на базовое
          # назначение без клонирования.
          #
          # Осторожно: это ГИПОТЕЗА, а не подтверждённый выигрыш. Ранее замеренный
          # эксперимент с 4 воркерами (4016s против 689s) отвергнут и остаётся
          # отвергнутым — речь только о параллелизме при одном воркере.
          SHARD_ARGS="$(python3 scripts/test_shards.py --count 3 --shard ${{ matrix.shard }})"
          echo "shard ${{ matrix.shard }}/3: $(wc -w <<< "${SHARD_ARGS}") classes"
          xcodebuild test-without-building $SHARD_ARGS \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -destination "platform=iOS Simulator,name=${SIMULATOR_NAME}" \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            -resultBundlePath "${RESULT_BUNDLE_PATH}" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY="-"

          echo "Tests (parallel disabled): $((SECONDS - start_seconds))s"

      - name: Report test failures
        # Runs even when the suite fails. Without this, a red run shows only
        # 'Test case ... failed' with no reason, and the actual assertion text
        # lives inside the .xcresult bundle — which needs xcrun to read. Anyone
        # without a Mac (or without waiting to download a 70 MB artifact) then
        # has to guess at the cause. Printing it inline makes the log the source
        # of truth for why a build is red.
        #
        # The parser is written to a file rather than passed via `python3 -c`.
        # Shell single-quoting around -c cannot contain the single quotes Python
        # needs for dict keys: they are stripped, and the script dies with
        # "f-string: expecting '='".
        if: failure()
        run: |
          bundle="${RESULT_BUNDLE_PATH}"
          if [[ ! -d "${bundle}" ]]; then
            echo "No result bundle at ${bundle} — the failure happened before tests ran."
            exit 0
          fi

          cat > /tmp/report_failures.py <<'PYEOF'
          import json, sys

          try:
              data = json.load(sys.stdin)
          except Exception as exc:
              print(f"(could not parse xcresult json: {exc})")
              sys.exit(0)


          def is_test_case(node):
              # Suites are nodes with children; the failing leaves are the cases.
              return not node.get("children")


          def walk(node):
              for child in node.get("children") or []:
                  walk(child)
              if node.get("result") != "Failed" or not is_test_case(node):
                  return
              print(f"\nFAILED: {node.get('name', '?')}")
              for summary in node.get("failureSummaries") or []:
                  for line in (summary.get("failureText") or "").splitlines():
                      print(f"    {line}")
                  locations = (summary.get("sourceCodeContext") or {}).get("location") or []
                  for loc in locations:
                      path = (loc.get("filePath") or "").split("/")[-1]
                      if path:
                          print(f"    at {path}:{loc.get('lineNumber')}")


          for root in data.get("testNodes") or []:
              walk(root)
          PYEOF

          echo "=============== TEST FAILURE DETAIL ==============="
          xcrun xcresulttool get test-results tests \
            --path "${bundle}" --format json 2>/dev/null \
          | python3 /tmp/report_failures.py || echo "(could not read the result bundle)"
          echo "==================================================="
          echo "--- summary ---"
          xcrun xcresulttool get test-results summary --path "${bundle}" 2>/dev/null || true

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shard }}
          path: ${{ env.RESULT_BUNDLE_PATH }}
          if-no-files-found: ignore

  build:
    name: Package IPA
    # Runs ALONGSIDE `test`, not after it. The IPA is built either way; whether
    # it is PUBLISHED is decided by the `publish` job, which needs both.
    needs: guard
    runs-on: macos-26
    timeout-minutes: 60
    env:
      PROJECT_PATH: HermesMobile.xcodeproj
      SCHEME: HermesMobile
      DERIVED_DATA_PATH: DerivedData
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "VER=$(cat VERSION)" >> $GITHUB_OUTPUT

      # Тот же SPM-кэш загрузки, что и в job `test`, — общий ключ: SourcePackages
      # не зависит от устройства или симулятора, раздельные ключи лишь удваивали
      # бы расход кэша при лимите 10 ГБ на репозиторий.
      - name: Restore SPM cache
        uses: actions/cache@v4
        with:
          path: ${{ env.DERIVED_DATA_PATH }}/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('HermesMobile.xcodeproj/project.pbxproj') }}
          restore-keys: |
            spm-${{ runner.os }}-

      # Same content-addressed CAS as the test job, separate path so the two
      # jobs cannot clobber each other's entries. A Release build shares most
      # of its compilation units with the test build.
      - name: Restore Xcode compilation cache
        uses: actions/cache@v4
        with:
          path: ${{ env.DERIVED_DATA_PATH }}/CompilationCache.noindex
          key: xcode-cas-device-${{ runner.os }}-${{ hashFiles('HermesMobile.xcodeproj/project.pbxproj', 'Package.resolved', '**/Package.resolved') }}
          restore-keys: |
            xcode-cas-device-${{ runner.os }}-

      - name: Build for device
        run: |
          set -euo pipefail
          start_seconds=${SECONDS}
          xcodebuild \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "${DERIVED_DATA_PATH}" \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            SWIFT_ENABLE_COMPILE_CACHE=YES \
            CLANG_ENABLE_COMPILE_CACHE=YES \
            CODE_SIGNING_ALLOWED=NO \
            build
          echo "Build for device: $((SECONDS - start_seconds))s"

      - name: Locate .app
        run: |
          echo "APP_PATH=$(find DerivedData/Build/Products -name '*.app' -path '*/Release-iphoneos/*' -type d | head -1)" >> $GITHUB_ENV

      - name: Package IPA
        run: |
          mkdir Payload && cp -R "$APP_PATH" Payload/ && zip -r "HermesPlus-${{ steps.version.outputs.VER }}.ipa" Payload && rm -rf Payload && ls -lh *.ipa

      - name: Upload IPA
        # The artifact is what `publish` hands to the Release — and, on a red
        # run, the only place the IPA stays without being shipped to anyone.
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: HermesPlus-${{ steps.version.outputs.VER }}.ipa
          retention-days: 30

  publish:
    name: Publish release
    # THE GATE. Both sides must be green, exactly as when `Package IPA` waited on
    # the test job: a failed suite still cannot publish.
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only on a real push. A manual workflow_dispatch run (used to verify the
    # suite without releasing) must not publish a release.
    if: github.event_name == 'push'
    # Scoped to this job, not the workflow: only the Release needs to write.
    # Without it the GITHUB_TOKEN has read-only contents and the step fails with
    # 403 "Resource not accessible by integration" — after everything else has
    # passed, so the failure lands on the last step and reads as a release
    # configuration problem rather than a missing permission.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "VER=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Download IPA
        uses: actions/download-artifact@v4
        with:
          name: ipa

      - name: Guard — never re-publish a delivered version
        # The single most important check in this workflow.
        #
        # `softprops/action-gh-release` UPDATES an existing Release when the tag
        # already exists — it does not fail. Combined with `if: push`, that meant
        # every push to `main` after a release rebuilt the IPA and overwrote the
        # artifact of a version that was ALREADY handed to the user. Measured on
        # v3.6.1: release published 22:06:12Z, its .ipa asset re-created at
        # 22:17:10Z by a later run of an unrelated commit. Four consecutive runs
        # did this, because `VERSION` stays at 3.6.1 until someone bumps it, so
        # every later commit still claims to be 3.6.1.
        #
        # The failure is silent and the version number lies afterwards: a tester
        # installing "3.6.1" cannot know which build they have. That is exactly
        # the "1.5.5 twice" defect the version invariant exists to prevent — the
        # workflow was reproducing it structurally, not through anyone's mistake.
        #
        # A tag is NOT evidence of delivery: it exists from the first release run
        # onward. The question is whether an artifact was published for it, since
        # the artifact is what a person installs.
        #
        # Order matters here: the guard is evaluated before any write, and it names
        # the commit it is judging so a skipped publish is never mistaken for a
        # failed one in the log.
        id: delivered
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.VER }}"
          echo "judging version ${VER} at commit ${GITHUB_SHA:0:8}"
          if gh release view "v${VER}" --repo "${{ github.repository }}" \
               --json assets --jq 'select(.assets | length > 0) | "has-asset"' 2>/dev/null \
               | grep -q has-asset; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Release skipped::Version ${VER} is already released with an artifact — not re-publishing."
            echo "This run's IPA stays available as a workflow artifact for inspection."
            echo "If the app content changed, bump VERSION (one release = one version)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Version ${VER} is not delivered yet — the Release will be published."
          fi

      - name: Tag this commit if it is the first to carry this version
        # The tag is what ties a version NUMBER to the exact CONTENTS that were
        # delivered. Creating it here — on the commit whose VERSION is being
        # published, after CI passed — means the tag can never point at a later
        # commit that merely still says the same number.
        #
        # This closes the ordering hole that produced the v3.6.1 overwrite: the
        # release action created the tag implicitly, so the tag's commit depended
        # on which run happened to publish first rather than on which commit the
        # version was finalised in.
        id: tagging
        if: steps.delivered.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="${{ steps.version.outputs.VER }}"
          if git ls-remote --exit-code --tags origin "v${VER}" >/dev/null 2>&1; then
            echo "tag v${VER} already exists on origin — leaving it alone."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v${VER}" -m "Hermex Plus ${VER}" "${GITHUB_SHA}"
            git push origin "v${VER}"
            echo "tagged ${GITHUB_SHA:0:8} as v${VER} — the commit this version was built from."
          fi

      - name: Create Release
        # Never when the guard above found a delivered version: a Release that
        # already carries an artifact is not re-published.
        if: steps.delivered.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VER }}
          name: Hermex Plus ${{ steps.version.outputs.VER }}
          body_path: CHANGELOG.md
          files: HermesPlus-${{ steps.version.outputs.VER }}.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
