name: Build Hermes Plus

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: echo "VER=$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Build for device
        run: >
          xcodebuild
          -project HermesMobile.xcodeproj
          -scheme HermesMobile
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Locate .app
        run: |
          echo "APP_PATH=$(find DerivedData/Build/Products -name '*.app' -path '*/Release-iphoneos/*' -type d | head -1)" >> $GITHUB_ENV
      - name: Package IPA
        run: |
          mkdir Payload && cp -R "$APP_PATH" Payload/ && zip -r "HermesPlus-${{ steps.version.outputs.VER }}.ipa" Payload && rm -rf Payload && ls -lh *.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: HermesPlus-${{ steps.version.outputs.VER }}-unsigned
          path: HermesPlus-${{ steps.version.outputs.VER }}.ipa
          retention-days: 30
